name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK platform 36 (runner image ships the SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run engine tests
        run: npm test

      - name: Copy browser libraries (xlsx, pdf.js, mammoth)
        run: npm run vendor

      - name: Generate Android project
        run: npx cap add android

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 scripts/make_icons.py android/app/src/main/res

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GC-Optimiser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GC-Optimiser-apk
          path: GC-Optimiser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GC Optimiser build ${{ github.run_number }}
          body: Debug-signed APK. Enable "Install unknown apps" for your browser/file manager, download GC-Optimiser.apk and open it.
          files: GC-Optimiser.apk
          make_latest: true
